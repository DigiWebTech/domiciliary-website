<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domiciliary Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="icon" href="img/logo.png">

    <!-- Step 1: Add Google Font link inside <head> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
 
<body>
   

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
       <!-- Logo -->
        <a class="navbar-brand" href="#"> 
          <img src="img/logo.png" alt="logo" class="web-logo">
        </a>
     
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" href="#Home">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#about">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#services">Services</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#testimonials">Testimonials</a>
          </li>
          <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
            <a class="btn btn-primary btn-custom" href="#contact">Contact Us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>


  <!-- Carousel -->

    <div id="carouselExampleAutoplaying"
     class="carousel slide"
     data-bs-ride="carousel"
     data-bs-interval="3000">

  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="img/carer.3.PNG" class=" w-100" alt="pic" style="height: 50vh; object-fit: cover;">
    </div>

    <div class="carousel-item">
      <img src="img/Carer.1.PNG" class=" w-100" alt="pic" style="height: 50vh; object-fit: cover;">
    </div>

    <div class="carousel-item">
      <img src="img/carer.2.PNG" class=" w-100" alt="pic" style="height: 50vh; object-fit: cover;">
    </div>

  </div>

  <!-- Previous Button -->
  <button class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleAutoplaying"
          data-bs-slide="prev">

    <span class="carousel-control-prev-icon"></span>

  </button>

  <!-- Next Button -->
  <button class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleAutoplaying"
          data-bs-slide="next">

    <span class="carousel-control-next-icon"></span>

  </button>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domiciliary Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="icon" href="img/logo.png">

    <!-- Step 1: Add Google Font link inside <head> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

      
 <nav class="navbar navbar-expand-lg fixed-top  container">
  <div class="container-fluid">

    <!-- Logo -->
    <a class="navbar-brand" href="#">
      <img src="img/logo.png" alt="logo" class="web-logo">
    </a>

    <!-- Foldable Menu Button -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarMenu"
      bg-warning
    >
      <span class="navbar-toggler-icon bg-warning"></span>
    </button>

    <!-- Navbar Links -->
    <div class="collapse navbar-collapse justify-content-center" id="navbarMenu">
      <ul class="navbar-nav">

        <li class="nav-item">
          <a class="nav-link active text-primary" href="#" id="nav-name">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-primary" href="#">About</a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-primary" href="#">Services</a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-primary" href="#">Contact</a>
        </li>

      </ul>
    </div>

  </div>
</nav>





 <!-- Carousel -->

<div id="carouselExampleAutoplaying"
     class="carousel slide"
     data-bs-ride="carousel"
     data-bs-interval="3000">

  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="img/carer.3.PNG" class="d-block w-100" alt="pic">
    </div>

    <div class="carousel-item">
      <img src="img/Carer.1.PNG" class="d-block w-100" alt="pic">
    </div>

    <div class="carousel-item">
      <img src="img/carer.2.PNG" class="d-block w-100" alt="pic">
    </div>

  </div>

  <!-- Previous Button -->
  <button class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleAutoplaying"
          data-bs-slide="prev">

    <span class="carousel-control-prev-icon"></span>

  </button>

  <!-- Next Button -->
  <button class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleAutoplaying"
          data-bs-slide="next">

    <span class="carousel-control-next-icon"></span>

  </button>

</div>
  
 
    <!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
